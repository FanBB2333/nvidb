name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml

  release-build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and check release distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the built wheel
        run: python -m pip install dist/*.whl

      - name: Check installed package and release version
        working-directory: ${{ runner.temp }}
        env:
          NVIDB_HOME: ${{ runner.temp }}/nvidb-release-smoke
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          import sys
          from importlib.metadata import version
          from importlib.resources import files

          from nvidb.config import VERSION

          installed_version = version("nvidb")
          assert installed_version == VERSION, (installed_version, VERSION)
          assert os.environ["GITHUB_REF_NAME"] == f"v{installed_version}", (
              f"Tag {os.environ['GITHUB_REF_NAME']} does not match package {installed_version}"
          )
          for resource in ("keeper.sh", "macos_notify.m", "nvidb.icns"):
              assert files("nvidb.sched").joinpath(resource).read_bytes(), resource
          subprocess.run(["nvidb", "--version"], check=True)
          for args in (("--version",), ("--help",), ("job", "submit", "--help"),
                       ("queue", "keeper", "--help")):
              subprocess.run([sys.executable, "-m", "nvidb", *args], check=True)
          PYTHON
          python -m pip check

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    # Publish the GitHub release's verified assets only on an explicit dispatch
    # against its version tag. Pushing a tag releases on GitHub first.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/nvidb/

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download verified GitHub release distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Select a version tag to publish to PyPI" >&2; exit 1 ;;
          esac
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' --pattern '*.tar.gz' --dir dist
      - name: Check release distributions
        run: |
          python -m pip install twine
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from packaging.utils import parse_sdist_filename, parse_wheel_filename

          expected = os.environ["GITHUB_REF_NAME"][1:]
          distributions = sorted(Path("dist").iterdir())
          assert len(distributions) == 2, distributions
          assert sum(path.suffix == ".whl" for path in distributions) == 1
          for path in distributions:
              parse = parse_wheel_filename if path.suffix == ".whl" else parse_sdist_filename
              name, version, *_ = parse(path.name)
              assert name == "nvidb" and str(version) == expected, path.name
          PYTHON
          python -m twine check --strict dist/*
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: release-build
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
