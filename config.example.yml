# nvidb Configuration Example
# Copy this file to ~/.nvidb/config.yml and modify it to your needs.
# Or use `nvidb add` command to interactively add servers.

basic:
  # Compact display mode (default: false)
  # - false: stretch table to fill terminal width (gives more space to processes)
  # - true:  compact table width (do not force fill)
  compact: false

  # Always include remote servers (default: false)
  # - true:  plain `nvidb` behaves like `nvidb --remote`
  #          (pass `--no-remote` for a one-off local-only run)
  # - false: remote servers are only used with the `--remote` flag
  remote: false

# TUI layout. nvidb rewrites this block whenever you change the view with a key
# press, so the next run starts where you left off. The rest of the file
# (including your comments) is left untouched, but comments placed *inside* this
# block are not preserved.
view:
  mode: nodes            # nodes | unified          ([v])
  detailed: false        # unified card layout      ([d])
  sort: node             # node | available | utilization ([s])
  filter: all            # all | available | busy | errors ([f])
  # Startup visibility in single-line mode. Detailed mode starts with the pane
  # visible; [p] can temporarily hide it.
  processes: false       # process panel for the selected GPU ([p])
  trends: false          # GPU + selected-process history     ([t])
  group_by_node: true    # node bands in the unified view      ([g])
  hide_unsupported: true # skip nodes without NVIDIA GPUs       ([u])
  # Click GPU/process rows or actions; the wheel scrolls the pane under it. Set
  # to false to keep the terminal's own mouse selection (with reporting on,
  # most terminals need Shift to drag-select).
  mouse: true

# Cluster job queue (`nvidb queue`, `nvidb job ...`). Every key is optional;
# the values shown here are the defaults.
queue:
  headroom_mb: 512       # VRAM never handed out, so a job cannot starve the driver
  max_jobs_per_gpu: 4    # concurrent queue jobs allowed on one card
  # CPU-only jobs (`--gpus 0`) reserve no VRAM, so this count is the only thing
  # bounding them. Set to 0 to allow any number.
  max_cpu_jobs_per_node: 4
  placement: spread      # spread: emptiest GPU first | pack: fullest GPU that fits
  default_vram: "0"      # assumed reservation when `--vram` is omitted
  tick_min_interval: 3   # seconds between automatic scheduler passes
  lock_ttl: 180          # seconds a client may hold the scheduler lease
  probe_timeout: 25      # seconds allowed for one node probe
  launch_timeout: 60     # seconds allowed to start a job
  job_root: ".nvidb/jobs"  # per-job directory on each node (relative to $HOME)
  include_local: false   # also schedule onto this machine

  # Where `nvidb queue daemon` pushes failures. Alerts are always recorded in
  # the queue database regardless of these settings; this section only controls
  # delivery, so a misconfigured channel can never lose a failure.
  notify:
    enabled: true
    desktop: true        # macOS notification centre / notify-send on Linux
    log: true            # append JSON lines to $NVIDB_HOME/alerts.log
    command: null        # optional: a shell command fed the alert as JSON on stdin
    min_severity: warning  # warning | error

servers:
  # Example server with SSH key authentication (recommended)
  - hostname: "server1.example.com"
    port: 22
    username: "user1"
    nickname: "GPU Server 1"
    auth: "auto"  # auto | key | password
    identityfile: "~/.ssh/id_ed25519"  # Optional, used only when auth is auto/key

  # Example server reached through a jump host from ~/.ssh/config.
  # A comma-separated value such as "login-a,login-b" enables multiple hops.
  - hostname: "10.0.0.42"
    port: 22
    username: "user2"
    nickname: "GPU Server via Jump Host"
    auth: "key"
    proxyjump: "login"

  # Example server with password authentication
  - hostname: "192.168.1.100"
    port: 22
    username: "admin"
    password: "your_password_here"  # Optional, will prompt if not set
    nickname: "Local GPU Workstation"
    auth: "auto"

  # Example server with custom SSH port
  - hostname: "server2.example.com"
    port: 2222
    username: "user2"
    nickname: "GPU Server 2 (Custom Port)"
    auth: "key"  # Use key-only authentication
    # identityfile: "~/.ssh/id_rsa"    # Optional, used only when auth is auto/key
